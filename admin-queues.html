<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการคิวลูกค้า (Firebase Real-time)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4a88f7' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f4f5f7] flex justify-center m-0 p-0 font-sans">

<div class="w-full max-w-[400px] min-h-screen bg-[#f4f5f7] relative flex flex-col border-x border-gray-100">
    
    <div class="bg-white pt-6 pb-4 rounded-b-3xl shadow-sm mb-6 z-10 sticky top-0">
        <div class="flex justify-between items-center px-6 mb-5">
            <h1 class="text-[22px] font-bold text-gray-800 m-0">คิวที่ลูกค้าจอง</h1>
            <!-- สังเกตว่าปุ่มรีเฟรชหายไป เพราะเราไม่จำเป็นต้องใช้แล้ว! -->
            <span class="text-green-500 text-xs font-medium flex items-center gap-1">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                Real-time
            </span>
        </div>

        <div class="flex justify-center gap-2 px-4">
            <button id="btn-latest" onclick="switchTab('latest')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">ล่าสุด</button>
            <button id="btn-upcoming" onclick="switchTab('upcoming')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm">ใกล้ถึงเวลา</button>
            <button id="btn-cancelled" onclick="switchTab('cancelled')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">คิวยกเลิก</button>
            <button id="btn-all" onclick="switchTab('all')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">ทั้งหมด</button>
        </div>
    </div>

    <div id="queue-container" class="px-5 pb-10 flex flex-col gap-4">
        <p class="text-center text-gray-400 mt-10">กำลังเชื่อมต่อฐานข้อมูล...</p>
    </div>

</div>

<!-- ⚠️ เปลี่ยนมาใช้ Firebase SDK แบบ Module แทน API_URL -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // ค่า Config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyAZbfP5tDU1uw8AWnl2ps7VyJCyjp7Hucc",
      authDomain: "usnailsclub-booking.firebaseapp.com",
      projectId: "usnailsclub-booking",
      storageBucket: "usnailsclub-booking.firebasestorage.app",
      messagingSenderId: "468456730848",
      appId: "1:468456730848:web:3894014fd37776bd176085"
    };

    // เปิดใช้งาน Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allBookings = [];
    let currentTab = 'upcoming'; 

    // 🌟 หัวใจสำคัญ: ดึงข้อมูลแบบ Real-time ด้วย onSnapshot
    onSnapshot(collection(db, "bookings"), (snapshot) => {
        allBookings = [];
        snapshot.forEach((doc) => {
            // เก็บข้อมูลทั้งหมด พร้อมกับ ID ของเอกสารนั้นๆ
            allBookings.push({ id: doc.id, ...doc.data() });
        });
        renderQueues(); 
    });

    // เนื่องจากเราใช้ type="module" ฟังก์ชันที่เรียกผ่าน onclick ใน HTML ต้องผูกกับ window
    window.switchTab = function(tabName) {
        currentTab = tabName;
        const buttons = ['latest', 'upcoming', 'cancelled', 'all'];
        buttons.forEach(btn => {
            const el = document.getElementById(`btn-${btn}`);
            el.className = "px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors";
        });
        document.getElementById(`btn-${tabName}`).className = "px-4 py-2 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm";
        renderQueues();
    }

    // 🌟 ฟังก์ชันยกเลิกคิว (ยิงตรงเข้า Firebase)
    window.adminCancelQueue = async function(docId) {
        if(!confirm("คุณต้องการ 'ยกเลิก' คิวนี้ใช่หรือไม่?")) return;
        
        try {
            // อ้างอิงไปยังคิวที่ต้องการยกเลิก
            const bookingRef = doc(db, "bookings", docId);
            // สั่งอัปเดตสถานะ (หน้าเว็บจะอัปเดตอัตโนมัติทันทีที่โค้ดนี้ทำงานเสร็จ!)
            await updateDoc(bookingRef, { status: "ยกเลิก" });
        } catch (error) {
            console.error("Error:", error);
            alert("ไม่สามารถยกเลิกคิวได้ กรุณาลองใหม่");
        }
    }

    function getBookingDateObj(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        const dateParts = dateStr.split('/');
        if (dateParts.length === 3) {
            const qDay = parseInt(dateParts[0], 10);
            const qMonth = parseInt(dateParts[1], 10) - 1; 
            const qYear = parseInt(dateParts[2], 10);
            const timeMatch = timeStr.match(/(\d{1,2})[.:](\d{2})/);
            if (timeMatch) {
                const qHour = parseInt(timeMatch[1], 10);
                const qMinute = parseInt(timeMatch[2], 10);
                return new Date(qYear, qMonth, qDay, qHour, qMinute);
            }
        }
        return null;
    }

    function isTimePassed(dateStr, timeStr) {
        const queueDateTime = getBookingDateObj(dateStr, timeStr);
        if(!queueDateTime) return false;
        return new Date() > queueDateTime;
    }

    function renderQueues() {
        const container = document.getElementById('queue-container');
        container.innerHTML = ''; 

        let filteredBookings = [];

        if (currentTab === 'latest') {
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time)).reverse();
        } else if (currentTab === 'upcoming') {
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time));
            filteredBookings.sort((a, b) => {
                let dateA = getBookingDateObj(a.date, a.time);
                let dateB = getBookingDateObj(b.date, b.time);
                if(dateA && dateB) return dateA - dateB;
                return 0;
            });
        } else if (currentTab === 'cancelled') {
            filteredBookings = allBookings.filter(b => b.status === 'ยกเลิก').reverse();
        } else if (currentTab === 'all') {
            filteredBookings = [...allBookings].reverse();
        }

        if (filteredBookings.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-400 mt-10">ไม่มีรายการคิว</p>`;
            return;
        }

        filteredBookings.forEach(q => {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-50 flex flex-col gap-2";
            let statusColor = q.status === 'ยกเลิก' ? 'text-red-500 bg-red-50' : 'text-green-600 bg-green-50';
            
            let actionHtml = '';
            if (q.status !== 'ยกเลิก') {
                // สังเกตว่าเราส่ง q.id (Firebase Document ID) ไปแทนเลขแถว (Row)
                actionHtml = `
                    <div class="mt-3 pt-3 border-t border-gray-100">
                        <button onclick="adminCancelQueue('${q.id}')" class="w-full py-2 bg-red-50 text-red-500 rounded-xl text-sm font-medium hover:bg-red-100 transition-colors">ยกเลิกคิวนี้</button>
                    </div>
                `;
            }
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="font-bold text-gray-800 text-[16px]">${q.date} | ${q.time} น.</span>
                    <span class="text-[11px] px-2.5 py-1 rounded-md ${statusColor} font-medium">${q.status}</span>
                </div>
                <div class="text-[14px] text-gray-600 flex flex-col gap-1 mt-1">
                    <span class="flex justify-between"><span>บริการ:</span> <span class="font-medium text-gray-800">${q.service}</span></span>
                    <span class="flex justify-between"><span>เบอร์โทร:</span> <a href="tel:${q.phone}" class="text-primary font-medium">${q.phone}</a></span>
                </div>
                ${actionHtml}
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
