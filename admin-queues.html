<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการคิวลูกค้า (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4a88f7' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f4f5f7] flex justify-center m-0 p-0 font-sans">

<div class="w-full max-w-[400px] min-h-screen bg-[#f4f5f7] relative flex flex-col pt-10 border-x border-gray-100">
    
    <div class="bg-white pt-6 pb-4 rounded-b-3xl shadow-sm mb-6 z-10">
        <h1 class="text-[22px] font-bold text-center text-gray-800 mb-6">คิวที่ลูกค้าจอง</h1>

        <div class="flex justify-center gap-2 px-4">
            <button id="btn-latest" onclick="switchTab('latest')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">ล่าสุด</button>
            <button id="btn-upcoming" onclick="switchTab('upcoming')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm">ใกล้ถึงเวลา</button>
            <button id="btn-cancelled" onclick="switchTab('cancelled')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">คิวยกเลิก</button>
            <button id="btn-all" onclick="switchTab('all')" class="px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">ทั้งหมด</button>
        </div>
    </div>

    <div id="queue-container" class="px-5 pb-10 flex flex-col gap-4">
        <p class="text-center text-gray-400 mt-10">กำลังโหลดข้อมูล...</p>
    </div>

</div>

<script>
    // ⚠️ ใส่ Web App URL อันล่าสุดของคุณที่นี่
    const API_URL = "https://script.google.com/macros/s/AKfycbxKHkRpwH9qXAzyIaHq9hZKwYQS_YzB3pEkpAL-8A2x2Z-o8KU4ZvlIIL338KHRgt1Iog/exec"; 
    
    let allBookings = [];
    let currentTab = 'upcoming'; 

    document.addEventListener("DOMContentLoaded", () => {
        fetchBookings();
    });

    function fetchBookings() {
        fetch(API_URL + "?action=getAllBookings")
            .then(response => response.json())
            .then(data => {
                allBookings = data;
                renderQueues(); 
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById('queue-container').innerHTML = `<p class="text-center text-red-400 mt-10">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
            });
    }

    function switchTab(tabName) {
        currentTab = tabName;
        
        const buttons = ['latest', 'upcoming', 'cancelled', 'all'];
        buttons.forEach(btn => {
            const el = document.getElementById(`btn-${btn}`);
            el.className = "px-4 py-2 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors";
        });

        const activeBtn = document.getElementById(`btn-${tabName}`);
        activeBtn.className = "px-4 py-2 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm";

        renderQueues();
    }

    // ฟังก์ชันช่วยแปลง dateStr, timeStr เป็น Date Object
    function getBookingDateObj(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        const dateParts = dateStr.split('/');
        if (dateParts.length === 3) {
            const qDay = parseInt(dateParts[0], 10);
            const qMonth = parseInt(dateParts[1], 10) - 1; 
            const qYear = parseInt(dateParts[2], 10);
            
            const timeMatch = timeStr.match(/(\d{1,2})[.:](\d{2})/);
            if (timeMatch) {
                const qHour = parseInt(timeMatch[1], 10);
                const qMinute = parseInt(timeMatch[2], 10);
                return new Date(qYear, qMonth, qDay, qHour, qMinute);
            }
        }
        return null;
    }

    function isTimePassed(dateStr, timeStr) {
        const queueDateTime = getBookingDateObj(dateStr, timeStr);
        if(!queueDateTime) return false;
        return new Date() > queueDateTime;
    }

    function renderQueues() {
        const container = document.getElementById('queue-container');
        container.innerHTML = ''; 

        let filteredBookings = [];

        if (currentTab === 'latest') {
            // "ล่าสุด": กรองคิวที่ "ยังไม่เลยเวลา" และ "ไม่ยกเลิก" และเรียงจากที่เพิ่งจองเข้ามา
            filteredBookings = allBookings
                .filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time))
                .reverse();
        } else if (currentTab === 'upcoming') {
            // "ใกล้ถึงเวลา": กรองคิวที่ "ยังไม่ยกเลิก" และ "ยังไม่เลยเวลา"
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time));
            
            // ⚠️ เรียงลำดับตามเวลาใกล้สุด (จากปัจจุบันไปอนาคต)
            filteredBookings.sort((a, b) => {
                let dateA = getBookingDateObj(a.date, a.time);
                let dateB = getBookingDateObj(b.date, b.time);
                if(dateA && dateB) return dateA - dateB;
                return 0;
            });
        } else if (currentTab === 'cancelled') {
            // "คิวยกเลิก"
            filteredBookings = allBookings.filter(b => b.status === 'ยกเลิก').reverse();
        } else if (currentTab === 'all') {
            // ⚠️ "ทั้งหมด"
            filteredBookings = [...allBookings].reverse();
        }

        if (filteredBookings.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-400 mt-10">ยังไม่มีคิวจอง</p>`;
            return;
        }

        filteredBookings.forEach(q => {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-50 flex flex-col gap-2";
            
            let statusColor = q.status === 'ยกเลิก' ? 'text-red-500 bg-red-50' : 'text-green-500 bg-green-50';
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <span class="font-semibold text-gray-800 text-[15px]">${q.date} | ${q.time}</span>
                    <span class="text-[10px] px-2 py-1 rounded-md ${statusColor} font-medium">${q.status}</span>
                </div>
                <div class="text-sm text-gray-800 flex justify-between font-medium">
                    <span>บริการ: ${q.service}</span>
                </div>
                <div class="text-sm text-gray-800 flex justify-between font-medium">
                    <span>เบอร์โทร: <a href="tel:${q.phone}" class="text-primary font-normal">${q.phone}</a></span>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
