<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการคิวลูกค้า (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4a88f7' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#1a1a1a] flex justify-center m-0 p-0 font-sans">

<div class="w-full max-w-[400px] min-h-screen bg-gray-50 relative flex flex-col pt-10">
    
    <h1 class="text-xl font-bold text-center text-black mb-6">คิวที่ลูกค้าจอง</h1>

    <div class="flex justify-center gap-2 mb-8 px-4">
        <button id="btn-latest" onclick="switchTab('latest')" class="px-5 py-1.5 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">ล่าสุด</button>
        <button id="btn-upcoming" onclick="switchTab('upcoming')" class="px-5 py-1.5 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm">คิวใกล้เวลา</button>
        <button id="btn-cancelled" onclick="switchTab('cancelled')" class="px-5 py-1.5 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors">คิวยกเลิก</button>
    </div>

    <div id="queue-container" class="px-5 pb-10 flex flex-col gap-3">
        <p class="text-center text-gray-400 mt-10">กำลังโหลดข้อมูล...</p>
    </div>

</div>

<script>
    // ⚠️ ใส่ Web App URL อันล่าสุดของคุณที่นี่
    const API_URL = "https://script.google.com/macros/s/AKfycbxKHkRpwH9qXAzyIaHq9hZKwYQS_YzB3pEkpAL-8A2x2Z-o8KU4ZvlIIL338KHRgt1Iog/exec"; 
    
    let allBookings = [];
    let currentTab = 'upcoming'; 

    document.addEventListener("DOMContentLoaded", () => {
        fetchBookings();
    });

    function fetchBookings() {
        fetch(API_URL + "?action=getAllBookings")
            .then(response => response.json())
            .then(data => {
                allBookings = data;
                renderQueues(); 
            })
            .catch(error => {
                console.error("Error:", error);
                document.getElementById('queue-container').innerHTML = `<p class="text-center text-red-400 mt-10">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
            });
    }

    function switchTab(tabName) {
        currentTab = tabName;
        
        const buttons = ['latest', 'upcoming', 'cancelled'];
        buttons.forEach(btn => {
            const el = document.getElementById(`btn-${btn}`);
            el.className = "px-5 py-1.5 rounded-full text-[13px] font-medium bg-gray-100 text-gray-400 transition-colors";
        });

        const activeBtn = document.getElementById(`btn-${tabName}`);
        activeBtn.className = "px-5 py-1.5 rounded-full text-[13px] font-medium bg-primary text-white transition-colors shadow-sm";

        renderQueues();
    }

    // ⚠️ เพิ่มฟังก์ชันเช็คเวลาว่า "เลยเวลาหรือยัง?"
    function isTimePassed(dateStr, timeStr) {
        if (!dateStr || !timeStr) return false;

        const dateParts = dateStr.split('/');
        if (dateParts.length === 3) {
            const qDay = parseInt(dateParts[0], 10);
            const qMonth = parseInt(dateParts[1], 10) - 1; 
            const qYear = parseInt(dateParts[2], 10);
            
            const timeMatch = timeStr.match(/(\d{1,2})[.:](\d{2})/);
            if (timeMatch) {
                const qHour = parseInt(timeMatch[1], 10);
                const qMinute = parseInt(timeMatch[2], 10);
                
                const queueDateTime = new Date(qYear, qMonth, qDay, qHour, qMinute);
                const now = new Date();
                
                return now > queueDateTime; // ถ้าเวลาปัจจุบันมากกว่าคิว = เลยเวลาแล้ว (true)
            }
        }
        return false;
    }

    function renderQueues() {
        const container = document.getElementById('queue-container');
        container.innerHTML = ''; 

        let filteredBookings = [];

        if (currentTab === 'latest') {
            // ⚠️ "ล่าสุด": กรองคิวที่ "ยังไม่เลยเวลา" เท่านั้น และกลับด้านเพื่อให้คิวจองล่าสุดขึ้นก่อน
            filteredBookings = allBookings
                .filter(b => !isTimePassed(b.date, b.time))
                .reverse();
        } else if (currentTab === 'upcoming') {
            // ⚠️ "คิวใกล้เวลา": กรองคิวที่ "ยังไม่ยกเลิก" และ "ยังไม่เลยเวลา"
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time));
        } else if (currentTab === 'cancelled') {
            // "คิวยกเลิก": ดึงเฉพาะสถานะยกเลิก (คงไว้แบบเดิมเพื่อเก็บประวัติ)
            filteredBookings = allBookings.filter(b => b.status === 'ยกเลิก');
        }

        if (filteredBookings.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-400 mt-10">ยังไม่มีคิวจอง</p>`;
            return;
        }

        filteredBookings.forEach(q => {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-1";
            
            let statusColor = q.status === 'ยกเลิก' ? 'text-red-500 bg-red-50' : 'text-green-600 bg-green-50';
            
            card.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="font-semibold text-gray-800">${q.date} | ${q.time}</span>
                    <span class="text-[11px] px-2 py-1 rounded-md ${statusColor}">${q.status}</span>
                </div>
                <div class="text-sm text-gray-600 flex justify-between">
                    <span>บริการ: <span class="text-gray-800">${q.service}</span></span>
                </div>
                <div class="text-sm text-gray-600 flex justify-between">
                    <span>เบอร์โทร: <a href="tel:${q.phone}" class="text-primary">${q.phone}</a></span>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
