<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการคิวลูกค้า (Firebase Real-time)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { primary: '#4a88f7' }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f4f5f7] flex justify-center m-0 p-0 font-sans">

<div class="w-full max-w-[400px] min-h-screen bg-[#f4f5f7] relative flex flex-col border-x border-gray-100">
    
    <!-- Header -->
    <div class="bg-white pt-10 pb-4 rounded-b-3xl shadow-sm mb-4 z-10 sticky top-0">
        <div class="flex items-center px-6 mb-5 relative justify-center">
            <!-- ปุ่มย้อนกลับตามดีไซน์ -->
            <button onclick="window.history.back()" class="w-10 h-10 rounded-full border-2 border-gray-900 flex items-center justify-center absolute left-5 hover:bg-gray-50 transition-colors">
                <svg class="w-5 h-5 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-[22px] font-bold text-gray-900 m-0 text-center">คิวที่ลูกค้าจอง</h1>
        </div>

        <div class="flex justify-center gap-2 px-4 mt-2">
            <button id="btn-latest" onclick="switchTab('latest')" class="px-5 py-2 rounded-full text-[14px] font-medium bg-gray-100 text-gray-400 transition-colors">ล่าสุด</button>
            <button id="btn-upcoming" onclick="switchTab('upcoming')" class="px-5 py-2 rounded-full text-[14px] font-medium bg-primary text-white transition-colors shadow-sm">ใกล้ถึงเวลา</button>
            <button id="btn-cancelled" onclick="switchTab('cancelled')" class="px-5 py-2 rounded-full text-[14px] font-medium bg-gray-100 text-gray-400 transition-colors">คิวยกเลิก</button>
            <button id="btn-all" onclick="switchTab('all')" class="px-5 py-2 rounded-full text-[14px] font-medium bg-gray-100 text-gray-400 transition-colors">ทั้งหมด</button>
        </div>
    </div>

    <!-- Container สำหรับการ์ด -->
    <div id="queue-container" class="px-4 pb-10 flex flex-col gap-4">
        <p class="text-center text-gray-400 mt-10">กำลังเชื่อมต่อฐานข้อมูล...</p>
    </div>

</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZbfP5tDU1uw8AWnl2ps7VyJCyjp7Hucc",
      authDomain: "usnailsclub-booking.firebaseapp.com",
      projectId: "usnailsclub-booking",
      storageBucket: "usnailsclub-booking.firebasestorage.app",
      messagingSenderId: "468456730848",
      appId: "1:468456730848:web:3894014fd37776bd176085"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allBookings = [];
    let currentTab = 'upcoming'; 

    onSnapshot(collection(db, "bookings"), (snapshot) => {
        allBookings = [];
        snapshot.forEach((doc) => {
            allBookings.push({ id: doc.id, ...doc.data() });
        });
        renderQueues(); 
    });

    window.switchTab = function(tabName) {
        currentTab = tabName;
        const buttons = ['latest', 'upcoming', 'cancelled', 'all'];
        buttons.forEach(btn => {
            const el = document.getElementById(`btn-${btn}`);
            el.className = "px-5 py-2 rounded-full text-[14px] font-medium bg-gray-100 text-gray-400 transition-colors";
        });
        document.getElementById(`btn-${tabName}`).className = "px-5 py-2 rounded-full text-[14px] font-medium bg-primary text-white transition-colors shadow-sm";
        renderQueues();
    }

    window.adminCancelQueue = async function(docId) {
        if(!confirm("คุณต้องการ 'ยกเลิก' คิวนี้ใช่หรือไม่?")) return;
        try {
            const bookingRef = doc(db, "bookings", docId);
            await updateDoc(bookingRef, { status: "ยกเลิก" });
        } catch (error) {
            console.error("Error:", error);
            alert("ไม่สามารถยกเลิกคิวได้ กรุณาลองใหม่");
        }
    }

    function getBookingDateObj(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        const dateParts = dateStr.split('/');
        if (dateParts.length === 3) {
            const qDay = parseInt(dateParts[0], 10);
            const qMonth = parseInt(dateParts[1], 10) - 1; 
            const qYear = parseInt(dateParts[2], 10);
            const timeMatch = timeStr.match(/(\d{1,2})[.:](\d{2})/);
            if (timeMatch) {
                const qHour = parseInt(timeMatch[1], 10);
                const qMinute = parseInt(timeMatch[2], 10);
                return new Date(qYear, qMonth, qDay, qHour, qMinute);
            }
        }
        return null;
    }

    function isTimePassed(dateStr, timeStr) {
        const queueDateTime = getBookingDateObj(dateStr, timeStr);
        if(!queueDateTime) return false;
        return new Date() > queueDateTime;
    }

    // 🌟 ฟังก์ชันแปลงวันที่สำหรับแยกโชว์ในฝั่งซ้าย
    function formatThaiDate(dateStr) {
        const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        const dayNames = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
        let dayStr = "-", monthStr = "-", dateNum = "-";
        
        if (dateStr) {
            const parts = dateStr.split('/');
            if(parts.length === 3) {
                dateNum = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10) - 1;
                monthStr = thaiMonths[m];
                const y = parseInt(parts[2], 10);
                const ceYear = y > 2500 ? y - 543 : y;
                const dObj = new Date(ceYear, m, dateNum);
                dayStr = dayNames[dObj.getDay()];
            }
        }
        return { dayStr, monthStr, dateNum };
    }

    function renderQueues() {
        const container = document.getElementById('queue-container');
        container.innerHTML = ''; 

        let filteredBookings = [];
        if (currentTab === 'latest') {
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time)).reverse();
        } else if (currentTab === 'upcoming') {
            filteredBookings = allBookings.filter(b => b.status !== 'ยกเลิก' && !isTimePassed(b.date, b.time));
            filteredBookings.sort((a, b) => {
                let dateA = getBookingDateObj(a.date, a.time);
                let dateB = getBookingDateObj(b.date, b.time);
                if(dateA && dateB) return dateA - dateB;
                return 0;
            });
        } else if (currentTab === 'cancelled') {
            filteredBookings = allBookings.filter(b => b.status === 'ยกเลิก').reverse();
        } else if (currentTab === 'all') {
            filteredBookings = [...allBookings].reverse();
        }

        if (filteredBookings.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-400 mt-10">ไม่มีรายการคิว</p>`;
            return;
        }

        filteredBookings.forEach(q => {
            const dateData = formatThaiDate(q.date);
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-2";
            
            let statusColor = q.status === 'ยกเลิก' ? 'text-red-500 bg-red-100' : 'text-green-600 bg-[#ccfbf1]';
            let actionHtml = '';
            
            // ปุ่มยกเลิกคิว (ซ่อนเมื่อถูกยกเลิกไปแล้ว)
            if (q.status !== 'ยกเลิก') {
                actionHtml = `
                    <div class="mt-2">
                        <button onclick="adminCancelQueue('${q.id}')" class="w-full py-2 bg-red-50 text-red-500 rounded-[14px] text-[14px] font-medium hover:bg-red-100 transition-colors border border-red-100">ยกเลิกคิวนี้</button>
                    </div>
                `;
            }
            
            // ดึงรูปและชื่อ ถ้าลูกค้าไม่ได้เปิดเผยโปรไฟล์ จะใช้ค่าพื้นฐาน
            const profilePic = q.pictureUrl || "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
            const profileName = q.displayName || "ลูกค้า (ไม่มีชื่อ)";

            card.innerHTML = `
                <div class="flex items-stretch gap-4">
                    <!-- โซนซ้าย: วันที่ -->
                    <div class="w-[30%] flex flex-col items-center justify-center border-r border-gray-200 py-1">
                        <span class="text-[14px] text-gray-500">${dateData.monthStr}</span>
                        <span class="text-[34px] font-bold text-gray-900 leading-none my-1">${dateData.dateNum}</span>
                        <span class="text-[14px] text-gray-500">${dateData.dayStr}</span>
                    </div>
                    
                    <!-- โซนขวา: ข้อมูล -->
                    <div class="w-[70%] flex flex-col justify-between py-1 pr-1">
                        <!-- แถวบน: เวลา บริการ สถานะ -->
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex gap-4">
                                <div class="flex flex-col">
                                    <span class="text-[11px] text-gray-500 mb-0.5">เวลา:</span>
                                    <span class="font-medium text-gray-800 text-[14px]">${q.time}</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[11px] text-gray-500 mb-0.5">บริการ:</span>
                                    <span class="font-medium text-gray-800 text-[14px] line-clamp-1">${q.service}</span>
                                </div>
                            </div>
                            <div class="flex flex-col items-end flex-shrink-0">
                                <span class="text-[11px] text-gray-500 mb-0.5">สถานะ:</span>
                                <span class="text-[11px] px-2 py-0.5 rounded ${statusColor} font-medium">${q.status}</span>
                            </div>
                        </div>
                        
                        <!-- เส้นคั่น -->
                        <div class="w-full h-px bg-gray-100 mb-3"></div>
                        
                        <!-- แถวล่าง: รูปโปรไฟล์ ชื่อ และปุ่มติดต่อ -->
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <img src="${profilePic}" class="w-8 h-8 rounded-full object-cover bg-gray-200 flex-shrink-0">
                                <span class="text-[13px] text-gray-700 truncate font-medium">คุณ: ${profileName}</span>
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <!-- ไอคอนโทรศัพท์ -->
                                <a href="tel:${q.phone}" class="w-8 h-8 rounded-full border border-gray-200 flex justify-center items-center text-gray-700 hover:bg-gray-50">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                </a>
                                <!-- ไอคอนแชท (ใช้ LINE ID ลูกค้า) -->
                                <a href="https://line.me/ti/p/~${q.lineUserId}" target="_blank" class="w-8 h-8 rounded-full border border-gray-200 flex justify-center items-center text-gray-700 hover:bg-gray-50">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                ${actionHtml}
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
