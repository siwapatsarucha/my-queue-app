<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าคิว (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: { 
                        primary: '#3b82f6', 
                        bgLight: '#f4f5f7',
                        inputBg: '#e8efff' 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 flex justify-center m-0 p-0 font-sans text-gray-800">

<!-- หน้าจอ Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-500 text-sm" id="loading-text">กำลังโหลดข้อมูลระบบ...</p>
</div>

<!-- โครงสร้างหลัก -->
<div class="w-full max-w-[400px] min-h-screen bg-bgLight relative flex flex-col border-x border-gray-100">
    
    <!-- Header -->
    <div class="pt-10 pb-4 px-5 flex items-center justify-between sticky top-0 bg-white z-10 shadow-sm">
        <button onclick="closeApp()" class="w-8 h-8 rounded-full border border-gray-800 flex items-center justify-center hover:bg-gray-100 transition-colors">
            <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-[17px] font-medium text-gray-800 m-0 text-center flex-1">ตั้งค่าคิว</h1>
        <div class="w-8"></div>

        <!-- ⚠️ ปุ่มเฟือง (เพิ่มใหม่แทนที่ div เปล่า) -->
        <button onclick="window.location.href='admin-default.html'" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors">
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
    </div>
    

    <!-- พื้นที่เนื้อหา -->
    <div class="px-5 flex-grow pb-[120px] flex flex-col gap-5 mt-6">
        
        <!-- การ์ด 1: ปฏิทินเลือกวัน -->
        <div class="bg-white rounded-3xl p-5 shadow-sm">
            <div id="calendar-days" class="flex justify-between items-center">
                <!-- วันที่จะถูกสร้างด้วย JavaScript -->
            </div>
        </div>

        <!-- การ์ด 2: รอบเวลาและจำนวนคิว -->
        <div class="bg-white rounded-3xl p-5 shadow-sm">
            <div class="flex justify-between items-center mb-5">
                <span class="text-sm text-gray-800 font-medium">รอบเวลาและจำนวนคิว</span>
                <button onclick="addTimeSlot()" class="bg-[#2a73ff] text-white text-[11px] px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-blue-700 transition-colors shadow-sm">
                    <span>+</span> เพิ่ม
                </button>
            </div>
            <div id="times-list" class="flex flex-col gap-1">
                <!-- ข้อมูลรอบเวลาจะแสดงตรงนี้ -->
            </div>
        </div>

        <!-- การ์ด 3: ปิดรอบรายวัน -->
        <div class="bg-white rounded-[24px] p-5 shadow-sm flex justify-between items-center">
            <span class="text-[13px] text-gray-800 font-medium">ปิดรับบริการจองคิววันนี้</span>
            <button id="toggle-close-day" onclick="toggleCloseDay()" class="w-10 h-6 rounded-full relative transition-colors duration-300 bg-gray-300">
                <div id="toggle-close-circle" class="w-5 h-5 bg-white rounded-full shadow-sm absolute top-[2px] left-[2px] transition-all duration-300"></div>
            </button>
        </div>

    </div>

    <!-- Bottom Action -->
    <div class="fixed bottom-0 left-0 w-full p-5 bg-bgLight flex justify-center pb-8">
        <div class="w-full max-w-[400px]">
            <button onclick="saveAdminSettings()" class="w-full py-3.5 bg-[#4285f4] text-white rounded-2xl text-[17px] hover:bg-blue-600 transition-colors font-medium shadow-md">
                บันทึกการเปลี่ยนแปลง
            </button>
        </div>
    </div>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxKHkRpwH9qXAzyIaHq9hZKwYQS_YzB3pEkpAL-8A2x2Z-o8KU4ZvlIIL338KHRgt1Iog/exec"; 
    const LIFF_ID = "2011391523-QXNptpyw";
    const adminLineIds = [
        "Uc15870aef60973959938d48d6cdac1da", 
        "Uf446e4361cea597d9ab87746949c31bc"  
    ];

    let globalTimes = []; // เทมเพลตเวลาเริ่มต้น
    let dailyTimes = {};  // เก็บข้อมูลเวลาแยกตามวัน
    let closedDaysData = []; 
    
    let datesList = [];
    let selectedDate = '';

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isInClient() || liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    if (adminLineIds.includes(profile.userId)) {
                        loadData();
                    } else {
                        document.body.innerHTML = `<div class="flex flex-col h-screen items-center justify-center bg-white p-5 text-center"><h1 class="text-4xl mb-4">⛔</h1><h2 class="text-xl text-red-500 font-medium mb-2">ไม่มีสิทธิ์เข้าถึง</h2></div>`;
                    }
                });
            } else { loadData(); } // สำหรับทดสอบบนเบราว์เซอร์
        }).catch(err => console.error("LIFF Init Error:", err));
    });

    function loadData() {
        showLoading("กำลังโหลดข้อมูล...");
        fetch(API_URL + "?action=getShopData")
            .then(response => response.json())
            .then(data => {
                // เก็บเวลาเริ่มต้นเป็นเทมเพลต
                // ของใหม่ (เติมคำว่า default เข้าไป)
globalTimes = (data.defaultTimes || []).map(t => ({
                    timeStr: t.timeStr, maxQueue: t.maxQueue, isActive: t.isActive !== undefined ? t.isActive : true 
                }));
                
                // ถ้าฝั่งหลังบ้านรองรับการดึง dailyTimes แล้ว ให้ใช้ค่าจากหลังบ้าน
                dailyTimes = data.dailyTimes || {};
                closedDaysData = data.closedDays ? data.closedDays.map(d => d.dateStr) : []; 
                
                initCalendar();
                selectDate(datesList[0].fullDate); // เลือกวันแรกอัตโนมัติ
                hideLoading();
            })
            .catch(error => {
                alert("ไม่สามารถดึงข้อมูลได้");
                hideLoading();
            });
    }

    // --- สร้างปฏิทิน 7 วัน ---
    function initCalendar() {
        datesList = [];
        const today = new Date();
        const dayNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        
        for(let i=0; i<7; i++) {
            let d = new Date(today);
            d.setDate(today.getDate() + i);
            let fullDateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            datesList.push({
                fullDate: fullDateStr,
                dayStr: dayNames[d.getDay()],
                dateNum: d.getDate()
            });
        }
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-days');
        container.innerHTML = '';
        datesList.forEach(d => {
            const isActive = d.fullDate === selectedDate;
            const circleClass = isActive ? "bg-primary text-white shadow-md" : "bg-transparent text-gray-600 hover:bg-gray-100";
            
            container.innerHTML += `
                <div class="flex flex-col items-center gap-2 cursor-pointer" onclick="selectDate('${d.fullDate}')">
                    <span class="text-xs ${isActive ? 'text-gray-800 font-medium' : 'text-gray-500'}">${d.dayStr}</span>
                    <div class="w-10 h-10 rounded-full flex justify-center items-center text-sm transition-all ${circleClass}">
                        ${d.dateNum}
                    </div>
                </div>
            `;
        });
    }

    function selectDate(dateStr) {
        selectedDate = dateStr;
        
        // 1. ดึงเทมเพลต Default มาเตรียมไว้เป็นฐาน
        let baseTimes = JSON.parse(JSON.stringify(globalTimes));
        let currentDaily = dailyTimes[selectedDate] || [];
        
        let mergedMap = new Map();
        
        // นำค่า Default มาวางยืนพื้นก่อน พร้อมแปะป้ายว่า isDefault = true
        baseTimes.forEach(t => mergedMap.set(t.timeStr, { ...t, isDefault: true }));
        
        // นำค่ารายวันที่บันทึกไว้มาเขียนทับ
        currentDaily.forEach(t => {
            if (mergedMap.has(t.timeStr)) {
                // ถ้าตรงกับ Default เดิม ให้คงสถานะ isDefault ไว้
                mergedMap.set(t.timeStr, { ...t, isDefault: true });
            } else {
                // ถ้าเป็นเวลาใหม่ที่เพิ่งกด + เพิ่มในวันนี้
                mergedMap.set(t.timeStr, { ...t, isDefault: false });
            }
        });
        
        let mergedArray = Array.from(mergedMap.values()).sort((a, b) => {
            let timeA = parseFloat(a.timeStr.replace(/[^0-9.]/g, ''));
            let timeB = parseFloat(b.timeStr.replace(/[^0-9.]/g, ''));
            return timeA - timeB;
        });

        dailyTimes[selectedDate] = mergedArray;

        renderCalendar();
        renderTimesList();
        renderCloseDayToggle();
    }

    // --- ส่วนเรนเดอร์: รอบเวลา ---
    function timeToInputFormat(timeStr) {
        if (!timeStr) return "10:00";
        const match = timeStr.match(/(\d{1,2})[.:](\d{2})/);
        if (match) return `${match[1].padStart(2, '0')}:${match[2].padStart(2, '0')}`;
        return "10:00"; 
    }
    function inputToTimeFormat(inputVal) {
        if (!inputVal) return "10.00น.";
        return inputVal.replace(':', '.') + 'น.';
    }

    function toggleActiveTime(index) {
        dailyTimes[selectedDate][index].isActive = !dailyTimes[selectedDate][index].isActive;
        renderTimesList();
    }

    function renderTimesList() {
        const container = document.getElementById('times-list');
        container.innerHTML = '';

        let currentTimes = dailyTimes[selectedDate] || [];

        currentTimes.forEach((t, index) => {
            const isLast = index === currentTimes.length - 1;
            const borderClass = isLast ? "" : "border-b border-gray-200/60";
            let timeVal = timeToInputFormat(t.timeStr);
            
            let isDefault = t.isDefault;
            
            // คืนค่าสีพื้นหลังปกติ (bg-inputBg) แต่ล็อกไม่ให้แก้เวลา (readonly)
            let timeInputAttr = isDefault 
                ? `readonly class="w-[85px] bg-inputBg text-gray-800 text-sm font-medium rounded-full px-2 py-1 outline-none text-center pointer-events-none opacity-90"` 
                : `class="w-[85px] bg-inputBg text-gray-800 text-sm font-medium rounded-full px-2 py-1 outline-none text-center cursor-pointer" onchange="dailyTimes['${selectedDate}'][${index}].timeStr = inputToTimeFormat(this.value)"`;

            // ป้ายบอกว่า Default เอาไปวางซ้อน (absolute) บนไอคอนนาฬิกา
            let clockIconWithBadge = `
                <div class="relative flex items-center justify-center w-6 h-6 mr-1.5">
                    <svg class="w-[20px] h-[20px] text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ${isDefault ? `<span class="absolute -top-1.5 -right-3.5 bg-gray-300/80 text-gray-600 text-[7px] px-1 py-[2px] rounded shadow-sm font-medium leading-none">Default</span>` : ''}
                </div>
            `;

            // แสดงปุ่มลบปกติ แต่ถ้าเป็น Default กดแล้วจะแจ้งเตือนแทน
            let deleteBtn = isDefault 
                ? `<button onclick="alert('คิว Default ไม่สามารถลบทิ้งได้ครับ\\nหากต้องการปิดรับคิวเวลานี้ ให้กดปิดสวิตช์ (สีเทา) แทนครับ')" class="text-red-500 opacity-70 hover:text-red-700 ml-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>` 
                : `<button onclick="removeTimeSlot(${index})" class="text-red-500 hover:text-red-700 ml-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>`;

            container.innerHTML += `
                <div class="flex items-center justify-between py-3 ${borderClass}">
                    <div class="flex items-center gap-0.5">
                        ${clockIconWithBadge}
                        <input type="time" value="${timeVal}" ${timeInputAttr}>
                        <span class="text-sm text-gray-800 ml-1">น.</span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
                        </svg>
                        <input type="number" value="${t.maxQueue}" onchange="dailyTimes['${selectedDate}'][${index}].maxQueue = parseInt(this.value)||1" class="w-[38px] bg-inputBg rounded-full text-center text-sm font-medium text-gray-800 outline-none py-1" min="1">
                        
                        <button onclick="toggleActiveTime(${index})" class="w-9 h-[22px] rounded-full relative transition-colors duration-300 ml-1 ${t.isActive ? 'bg-[#2a73ff]' : 'bg-gray-300'}">
                            <div class="w-[18px] h-[18px] bg-white rounded-full shadow-sm absolute top-[2px] transition-all duration-300 ${t.isActive ? 'right-[2px]' : 'left-[2px]'}"></div>
                        </button>

                        ${deleteBtn}
                    </div>
                </div>
            `;
        });
    }

    function addTimeSlot() {
        if (!dailyTimes[selectedDate]) dailyTimes[selectedDate] = [];
        dailyTimes[selectedDate].push({ timeStr: "10.00น.", maxQueue: 1, isActive: true });
        renderTimesList();
    }
    function removeTimeSlot(index) {
        dailyTimes[selectedDate].splice(index, 1);
        renderTimesList();
    }

    // --- ส่วนเรนเดอร์: ปิดวัน ---
    function toggleCloseDay() {
        const index = closedDaysData.indexOf(selectedDate);
        if (index > -1) {
            closedDaysData.splice(index, 1); // เปิดรับคิว
        } else {
            closedDaysData.push(selectedDate); // ปิดรับคิว
        }
        renderCloseDayToggle();
    }

    function renderCloseDayToggle() {
        const isClosed = closedDaysData.includes(selectedDate);
        const toggleBtn = document.getElementById('toggle-close-day');
        const toggleCircle = document.getElementById('toggle-close-circle');

        if (isClosed) {
            toggleBtn.classList.replace('bg-gray-300', 'bg-red-500'); // สีแดงเมื่อปิดร้าน
            toggleCircle.classList.replace('left-[2px]', 'right-[2px]');
        } else {
            toggleBtn.classList.replace('bg-red-500', 'bg-gray-300');
            toggleCircle.classList.replace('right-[2px]', 'left-[2px]');
        }
    }

    // --- บันทึกข้อมูล ---
    function saveAdminSettings() {
        showLoading("กำลังบันทึกข้อมูล...");
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'updateDailySettings', // ⚠️ ส่ง action ใหม่ไปหลังบ้าน
                dailyTimes: dailyTimes,
                closedDays: closedDaysData 
            })
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") { alert("บันทึกข้อมูลเรียบร้อยแล้ว!"); } 
            else { alert("เกิดข้อผิดพลาด: " + res.message); }
            hideLoading();
        })
        .catch(error => {
            alert("บันทึกข้อมูลไม่สำเร็จ");
            hideLoading();
        });
    }

    function closeApp() { if (liff.isInClient()) liff.closeWindow(); }
    function showLoading(text) { document.getElementById('loading-text').innerText = text; document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
</script>
</body>
</html>
