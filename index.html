<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: '#4a88f7', primaryHover: '#3b76d9',
                        stepBg: '#eef4ff', stepInactive: '#b0c4de', grayLight: '#f3f4f6',
                        bgLight: '#f4f5f7'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .step-item.active .step-circle, .step-item.completed .step-circle { @apply bg-primary; }
            .step-item.active .step-text, .step-item.completed .step-text { @apply text-primary; }
            .step-item { @apply justify-start !important; }
            .step-text { @apply min-h-[40px] pt-1 !important; }
            .chip { @apply px-5 py-2.5 bg-grayLight rounded-full text-[13px] text-gray-600 cursor-pointer transition-colors duration-200 border border-transparent shadow-sm; }
            .chip.active { @apply bg-primary text-white shadow-md border-primary; }
            .time-slot { @apply px-4 py-2 bg-grayLight rounded-2xl text-[13px] text-gray-700 cursor-pointer transition-all shadow-sm; }
            .time-slot.active { @apply bg-primary text-white shadow-md; }
            .time-slot.disabled { @apply line-through text-gray-400 bg-gray-50 shadow-none cursor-not-allowed; pointer-events: none; }
            .cal-date { @apply w-11 h-11 rounded-full flex justify-center items-center text-sm cursor-pointer transition-all; }
            .cal-date.active { @apply bg-primary text-white shadow-md font-medium; }
            .cal-date.disabled { @apply bg-transparent text-red-300 cursor-not-allowed; pointer-events: none; }
            .cal-day-text { @apply text-xs text-gray-600 font-medium mb-2; }
            .content-card { @apply bg-white rounded-3xl p-5 shadow-sm mb-4 border border-gray-50; }
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center m-0 p-0 font-sans">

<div id="loading-overlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลร้าน...</p>
</div>

<div class="w-full max-w-[400px] h-screen bg-bgLight relative flex flex-col overflow-x-hidden border-x border-gray-100">
    <div id="stepper-container" class="bg-bgLight"></div>

    <!-- Screen 1: เลือกวัน เวลา และบริการ -->
    <div class="screen flex flex-col p-5 flex-grow pb-[100px] overflow-y-auto" id="screen1">
        <div class="content-card flex flex-col gap-2">
            <div id="calendar-header" class="text-left text-gray-500 font-bold text-[19px] px-1 tracking-wide mt-1"></div>
            <div id="calendar-container" class="flex justify-between items-center text-center mt-2 overflow-x-auto gap-4 pb-2"></div>
        </div>
        
        <div class="content-card">
            <div id="services-container" class="flex flex-wrap gap-2.5"></div>
        </div>
        
        <div class="content-card flex flex-col h-[160px] overflow-y-auto">
            <div id="times-container" class="flex flex-wrap gap-2.5 content-start"></div>
        </div>
    </div>

    <!-- Screen 2: ใส่เบอร์โทรเพื่อยืนยัน -->
    <div class="screen hidden flex-col p-5 flex-grow pb-[180px]" id="screen2">
        <div class="relative w-full max-w-[340px] mx-auto mt-20 mb-auto">
            <div class="bg-white rounded-[28px] shadow-sm border border-gray-50 pt-44 pb-12 px-6 flex flex-col items-center relative z-0">
                <h3 class="text-[#1877f2] font-bold text-[20px] mb-6">กรุณาใส่เบอร์โทร</h3>
                <input type="tel" id="phone-input" class="w-full text-[32px] text-center outline-none bg-transparent font-medium text-gray-800 placeholder-gray-200 tracking-[0.1em] mb-2" placeholder="08X-XXX-XXXX">
                <p id="phone-error" class="text-red-500 text-sm hidden">กรุณาระบุเบอร์โทรศัพท์</p>
            </div>
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 w-[85%] bg-[#dbeafe] rounded-[20px] p-6 shadow-sm z-10 flex flex-col">
                <h3 class="text-[#1877f2] font-bold text-[19px] text-center mb-4">คิวที่คุณเลือก</h3>
                <div class="text-left text-[15px] text-gray-800 flex flex-col gap-2.5 px-3" id="booking-preview"></div>
            </div>
        </div>
    </div>

    <!-- Screen 3: จองสำเร็จ -->
    <div class="screen hidden flex-col p-6 flex-grow pb-[160px]" id="screen3">
        <div class="m-auto text-center bg-white p-10 rounded-[28px] shadow-sm border border-gray-50 w-full">
            <h1 class="text-[38px] text-gray-800 font-medium leading-[1.2] m-0">จองคิว<br>เรียบร้อยค่ะ</h1>
            <p id="summary-text" class="text-gray-500 mt-6 text-[15px] leading-relaxed"></p>
        </div>
    </div>

    <!-- Bottom Actions -->
    <div id="bottom-actions" class="absolute bottom-0 left-0 w-full p-5 bg-bgLight box-border flex flex-col gap-3">
        <button class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-md hover:bg-blue-600 transition-colors" onclick="validateStep1()">Next</button>
        <div class="flex gap-3 w-full mt-1">
            <a href="tel:0957356302" class="flex-1 py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center gap-2 hover:bg-blue-50 transition-colors">
                <span>โทรสอบถาม</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            </a>
            <button onclick="if(typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();" class="w-[90px] py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center hover:bg-blue-50 transition-colors">
                แชท
            </button>
        </div>
    </div>
</div>
    
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./stepper.js"></script>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    // ค่า Config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyAZbfP5tDU1uw8AWnl2ps7VyJCyjp7Hucc",
      authDomain: "usnailsclub-booking.firebaseapp.com",
      projectId: "usnailsclub-booking",
      storageBucket: "usnailsclub-booking.firebasestorage.app",
      messagingSenderId: "468456730848",
      appId: "1:468456730848:web:3894014fd37776bd176085"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LIFF_ID = "2011391523-fqHvpw34"; // แก้ไขเป็น LIFF ID ของหน้าจองคิวลูกค้า

    // 🌟 ตัวแปรเก็บข้อมูลจาก Firebase Settings
    let globalTimes = [];
    let dailyTimes = {};
    let closedDaysData = [];
    
    // ตั้งค่าจำนวนวันล่วงหน้า (ส่วนนี้ตั้งค่าไว้ในโค้ดได้เลย)
    const DAYS_TO_GENERATE = 14; 

    let shopData = { dates: [] };
    let bookingForm = { phone: '', date: '', service: '', time: '', lineUserId: '' };
    let realTimeBookings = []; 

    window.selectService = selectService;
    window.selectDate = selectDate;
    window.selectTime = selectTime;
    window.validateStep1 = validateStep1;
    window.validateStep2 = validateStep2;
    window.closeAndSendMessage = closeAndSendMessage;

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (liff.isInClient() || liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        bookingForm.lineUserId = profile.userId;
                    }).catch(err => console.error("Error profile:", err));
                }
            })
            .catch((err) => console.error("LIFF Init Error: ", err));

        window.myStepper = new Stepper({
            containerId: 'stepper-container',
            steps: ['Start', 'Step2', 'Finish'],
            initialStep: 1,
            onStepChange: function(newStep) {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('flex'); screen.classList.add('hidden');
                });
                document.getElementById('screen' + newStep).classList.remove('hidden');
                document.getElementById('screen' + newStep).classList.add('flex');

                const bottomActions = document.getElementById('bottom-actions');
                
                if (newStep === 1) {
                    bottomActions.innerHTML = `
                        <button class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-md hover:bg-blue-600 transition-colors" onclick="validateStep1()">Next</button>
                        <div class="flex gap-3 w-full mt-1">
                            <a href="tel:0957356302" class="flex-1 py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center gap-2 hover:bg-blue-50 transition-colors">
                                <span>โทรสอบถาม</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            </a>
                            <button onclick="if(typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();" class="w-[90px] py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center hover:bg-blue-50 transition-colors">แชท</button>
                        </div>
                    `;
                } else if (newStep === 2) {
                    bottomActions.innerHTML = `
                        <button id="btn-next-step2" class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-sm hover:bg-blue-600 transition-colors" onclick="validateStep2()">ยืนยันการจองคิว</button>
                        <button class="w-full py-3.5 px-4 bg-[#e5e7eb] text-gray-400 rounded-full text-[17px] font-medium hover:bg-gray-300 transition-colors mt-1" onclick="window.myStepper.prev()">กลับไปแก้ไขเวลา</button>
                    `;
                } else if (newStep === 3) {
                    bottomActions.innerHTML = `<button class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-md hover:bg-blue-600 transition-colors" onclick="closeAndSendMessage()">ยืนยันและปิดหน้าต่าง</button>`;
                }
            }
        });

        // ดึงข้อมูลการตั้งค่าร้านค้าก่อนโหลดปฏิทิน
        fetchShopConfig();
    });

    // 🌟 ดึงข้อมูลจากแอดมินมาใช้งาน
    async function fetchShopConfig() {
        try {
            const docRef = doc(db, "settings", "shopConfig");
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                globalTimes = data.defaultTimes || [];
                dailyTimes = data.dailyTimes || {};
                closedDaysData = data.closedDays || [];
                
                // 🟢 เพิ่ม 2 บรรทัดนี้ เพื่อดึงบริการจาก Firebase
                const fetchedServices = data.services || ["ทำเล็บเจล", "ต่อเล็บ PVC", "สปามือ/เท้า", "ถอดเล็บ", "เพ้นท์เล็บ"];
                shopData.services = fetchedServices;
            }
            
            initCalendar();
            startRealtimeListener(); 
        } catch (error) {
            console.error("Error fetching config:", error);
            alert("ไม่สามารถดึงข้อมูลวันและเวลาได้");
            document.getElementById('loading-overlay').classList.add('hidden');
        }
    }

    function initCalendar() {
        const dates = [];
        const today = new Date();
        const dayNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        
        for (let i = 0; i < DAYS_TO_GENERATE; i++) {
            let d = new Date(today);
            d.setDate(d.getDate() + i);
            let fullDate = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
            
            // เช็คว่าวันนั้นถูกแอดมินสั่ง "ปิดร้าน" ไว้หรือเปล่า
            dates.push({
                fullDate: fullDate,
                dateNum: d.getDate().toString(),
                dayStr: dayNames[d.getDay()],
                isClosed: closedDaysData.includes(fullDate) 
            });
        }
        shopData.dates = dates;
        document.getElementById('loading-overlay').classList.add('hidden');
        
        renderServices();
        renderCalendar();
        
        // ค้นหาวันแรกที่ร้านไม่ได้ปิด
        const firstAvailableDate = shopData.dates.find(d => !d.isClosed);
        if (firstAvailableDate) {
            selectDate(firstAvailableDate.fullDate);
        } else {
            document.getElementById('times-container').innerHTML = '<p class="w-full text-center text-red-500">ขออภัยค่ะ ร้านปิดให้บริการในช่วงนี้</p>';
        }
    }

    function startRealtimeListener() {
        onSnapshot(collection(db, "bookings"), (snapshot) => {
            realTimeBookings = [];
            snapshot.forEach((doc) => {
                realTimeBookings.push(doc.data());
            });
            if(bookingForm.date) renderTimes(bookingForm.date);
        });
    }

    function renderServices() {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        
        // 🟢 เปลี่ยนจาก SHOP_SERVICES เป็น shopData.services
        shopData.services.forEach((srv, index) => {
            const div = document.createElement('div');
            div.className = `chip ${index === 0 ? 'active' : ''}`;
            div.innerText = srv;
            div.onclick = () => selectService(div, srv);
            container.appendChild(div);
        });
        
        if(shopData.services.length > 0) bookingForm.service = shopData.services[0];
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        container.innerHTML = '';
        
    

        shopData.dates.forEach(d => {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center gap-1.5 min-w-[44px]";
            
            // ถ้าร้านปิด ให้แสดงป้ายสีแดงและกดไม่ได้
            if (d.isClosed) {
                wrapper.innerHTML = `
                    <div class="cal-day-text text-red-400">ปิด</div>
                    <div class="cal-date disabled">${d.dateNum}</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="cal-day-text">${d.dayStr}</div>
                    <div class="cal-date" id="date-${d.fullDate.replace(/\//g, '-')}" onclick="selectDate('${d.fullDate}')">${d.dateNum}</div>
                `;
            }
            container.appendChild(wrapper);
        });
    }

    // ฟังก์ชันคำนวณรอบเวลาทั้งหมดของวันนั้นๆ
    function getTimesForDate(dateStr) {
        let baseTimes = JSON.parse(JSON.stringify(globalTimes));
        let currentDaily = dailyTimes[dateStr] || [];
        
        let mergedMap = new Map();
        baseTimes.forEach(t => mergedMap.set(t.timeStr, t));
        
        currentDaily.forEach(t => {
            mergedMap.set(t.timeStr, t);
        });
        
        // คืนค่าเฉพาะคิวที่แอดมินเปิดใช้งาน (isActive: true)
        let mergedArray = Array.from(mergedMap.values()).filter(t => t.isActive).sort((a, b) => {
            let timeA = parseFloat(a.timeStr.replace(/[^0-9.]/g, ''));
            let timeB = parseFloat(b.timeStr.replace(/[^0-9.]/g, ''));
            return timeA - timeB;
        });
        return mergedArray;
    }

    function renderTimes(selectedDateFull) {
        const container = document.getElementById('times-container');
        container.innerHTML = '';
        
        const dateBookings = realTimeBookings.filter(b => b.date === selectedDateFull && b.status !== 'ยกเลิก');
        
        const now = new Date();
        const selectedParts = selectedDateFull.split('/');
        const selectedDate = new Date(selectedParts[2], selectedParts[1] - 1, selectedParts[0]);
        const isToday = now.getFullYear() === selectedDate.getFullYear() &&
                        now.getMonth() === selectedDate.getMonth() &&
                        now.getDate() === selectedDate.getDate();

        // ดึงข้อมูลรอบเวลาที่คำนวณมาแล้ว (อิงจากที่แอดมินตั้งค่า)
        const timesForToday = getTimesForDate(selectedDateFull);

        if (timesForToday.length === 0) {
            container.innerHTML = '<p class="w-full text-center text-gray-400 mt-4">ไม่มีรอบเวลาให้บริการในวันนี้</p>';
            return;
        }

        timesForToday.forEach(t => {
            const bookedCount = dateBookings.filter(b => b.time === t.timeStr).length;
            let isDisabled = bookedCount >= t.maxQueue; 

            if (isToday && !isDisabled) {
                const timeMatch = t.timeStr.match(/(\d{1,2})[.:](\d{2})/);
                if (timeMatch) {
                    const slotHour = parseInt(timeMatch[1], 10);
                    const slotMinute = parseInt(timeMatch[2], 10);
                    if (now.getHours() > slotHour || (now.getHours() === slotHour && now.getMinutes() >= slotMinute)) {
                        isDisabled = true; 
                    }
                }
            }

            const div = document.createElement('div');
            div.className = `time-slot ${isDisabled ? 'disabled' : ''}`;
            if(bookingForm.time === t.timeStr && !isDisabled) div.classList.add('active');
            
            div.innerText = t.timeStr;
            if(!isDisabled) {
                div.onclick = () => selectTime(div, t.timeStr);
            }
            container.appendChild(div);
        });
        
        if (bookingForm.time) {
            const isStillAvailable = Array.from(container.children).some(el => el.innerText === bookingForm.time && !el.classList.contains('disabled'));
            
            // 🌟 แก้ไขตรงนี้: เช็คว่าลูกค้ายังอยู่หน้าแรก (screen1) หรือไม่ 
            const isScreen1Visible = document.getElementById('screen1').classList.contains('flex');
            
            // ถ้าเวลาไม่ว่างแล้ว และยังอยู่หน้าแรก ถึงจะเคลียร์ค่าเวลาทิ้ง
            if (!isStillAvailable && isScreen1Visible) { 
                bookingForm.time = ''; 
            }
        }
    }

    function selectService(element, serviceName) {
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.service = serviceName;
    }

    function updateMonthHeader(dateString) {
        const header = document.getElementById('calendar-header');
        if (!header) return;
        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const parts = dateString.split('/');
        let year = parseInt(parts[2], 10);
        let monthIndex = parseInt(parts[1], 10) - 1;
        if (year < 2500) year += 543; // แปลงเป็น พ.ศ.
        header.innerHTML = `${thaiMonths[monthIndex]} ${year}`;
    }

    function selectDate(fullDate) {
        document.querySelectorAll('.cal-date').forEach(el => el.classList.remove('active'));
        const targetId = `date-${fullDate.replace(/\//g, '-')}`;
        const targetElement = document.getElementById(targetId);
        if(targetElement) targetElement.classList.add('active');
        
        bookingForm.date = fullDate;
        updateMonthHeader(fullDate);
        renderTimes(fullDate); 
    }

    // 🌟 นำโค้ดนี้ไปวางทับฟังก์ชัน selectTime อันเดิม
    function selectTime(element, timeStr) {
        // 1. ลบสถานะ active จากปุ่มเวลาอื่นทั้งหมด
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('active'));
        
        // 2. ใส่สถานะ active ให้ปุ่มที่เพิ่งกด
        element.classList.add('active');
        
        // ⚠️ 3. บรรทัดนี้สำคัญมาก! เป็นการบันทึกเวลาที่ลูกค้ากดลงในระบบ
        bookingForm.time = timeStr; 
    }

    function validateStep1() {
        if(!bookingForm.time) {
            alert("กรุณาเลือกรอบเวลาก่อนดำเนินการต่อ");
            return;
        }
        document.getElementById('booking-preview').innerHTML = 
            `<p>บริการ: <span class="font-bold text-black">${bookingForm.service}</span></p>
             <p>วันที่: <span class="font-bold text-black">${bookingForm.date}</span></p>
             <p>เวลา: <span class="font-bold text-black">${bookingForm.time} น.</span></p>`;
        window.myStepper.next();
    }

    async function validateStep2() {
        const phone = document.getElementById('phone-input').value.trim();
        if(!phone) {
            document.getElementById('phone-error').classList.remove('hidden');
            return;
        }
        document.getElementById('phone-error').classList.add('hidden');
        bookingForm.phone = phone;
        
        const btnNext = document.getElementById('btn-next-step2');
        btnNext.innerText = "กำลังบันทึกข้อมูล...";
        btnNext.disabled = true;

        try {
            await addDoc(collection(db, "bookings"), {
                phone: bookingForm.phone,
                service: bookingForm.service,
                date: bookingForm.date,
                time: bookingForm.time,
                lineUserId: bookingForm.lineUserId || "ไม่ระบุ",
                status: "รอรับบริการ",
                createdAt: serverTimestamp() 
            });
            
            document.getElementById('summary-text').innerText = 
                `เบอร์: ${bookingForm.phone}\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date} เวลา ${bookingForm.time}`;
            window.myStepper.next(); 

        } catch (error) {
            console.error("Error:", error);
            alert("บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่");
            btnNext.innerText = "ยืนยันการจองคิว";
            btnNext.disabled = false;
        }
    }

    function closeAndSendMessage() {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.sendMessages([
                {
                    type: 'text',
                    text: `ยืนยันการจองคิวค่ะ 🎉\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date}\nเวลา: ${bookingForm.time}`
                }
            ]).then(() => {
                liff.closeWindow(); 
            }).catch((error) => {
                liff.closeWindow(); 
            });
        } else {
            alert("บันทึกคิวเรียบร้อยแล้ว!");
            location.reload(); 
        }
    }
</script>

</body>
</html>
