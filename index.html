<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: '#4a88f7', primaryHover: '#3b76d9',
                        stepBg: '#eef4ff', stepInactive: '#b0c4de', grayLight: '#f3f4f6',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .step-item.active .step-circle, .step-item.completed .step-circle { @apply bg-primary; }
            .step-item.active .step-text, .step-item.completed .step-text { @apply text-primary; }
            .chip { @apply px-[18px] py-[10px] bg-grayLight rounded-full text-sm text-gray-700 cursor-pointer transition-colors duration-200; }
            .chip.active { @apply bg-primary text-white; }
            .time-slot { @apply px-3 py-2 bg-grayLight rounded-lg text-[13px] text-gray-700 cursor-pointer; }
            .time-slot.active { @apply bg-primary text-white; }
            .time-slot.disabled { @apply line-through text-gray-400 bg-gray-50 cursor-not-allowed; pointer-events: none; }
            .cal-date { @apply w-10 h-10 rounded-full flex justify-center items-center text-base cursor-pointer; }
            .cal-date.active { @apply bg-primary text-white shadow-md; }
            .cal-date.disabled { @apply bg-transparent text-gray-300 cursor-not-allowed; pointer-events: none; }
        }
    </style>
</head>
<body class="bg-gray-200 flex justify-center m-0 p-0 font-sans">

<!-- หน้าจอ Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-500">กำลังโหลดข้อมูลร้าน...</p>
</div>

<div class="w-full max-w-[400px] h-screen bg-white relative flex flex-col overflow-x-hidden">
    <div id="stepper-container"></div>

    <!-- Screen 1 -->
    <div class="screen flex flex-col p-8 flex-grow pb-[160px]" id="screen1">
        <div class="mt-auto mb-auto text-center">
            <p class="text-gray-500 mb-8 text-base">กรุณาใส่เบอร์โทร<br>เพื่อจองคิว</p>
            <input type="tel" id="phone-input" class="border-b border-black w-4/5 text-lg text-center p-1 outline-none focus:border-primary" placeholder="08x-xxx-xxxx">
            <p id="phone-error" class="text-red-500 text-sm mt-2 hidden">กรุณาระบุเบอร์โทรศัพท์</p>
        </div>
    </div>

    <!-- Screen 2 -->
    <div class="screen hidden flex-col p-8 flex-grow pb-[160px] overflow-y-auto" id="screen2">
        <div id="calendar-container" class="flex justify-between mb-6 text-center mt-2"></div>
        <div id="services-container" class="flex flex-wrap gap-2.5 mb-6"></div>
        <div id="times-container" class="h-[300px] overflow-y-auto border border-gray-200 rounded-xl p-5 flex flex-wrap gap-2.5"></div>
    </div>

    <!-- Screen 3 -->
    <div class="screen hidden flex-col p-8 flex-grow pb-[160px]" id="screen3">
        <div class="m-auto text-center">
            <h1 class="text-[42px] text-gray-600 font-normal leading-[1.3] m-0">จองคิว<br>เรียบร้อยค่ะ</h1>
            <p id="summary-text" class="text-gray-500 mt-4 text-sm"></p>
        </div>
    </div>

    <!-- Bottom Actions -->
    <div id="bottom-actions" class="absolute bottom-0 left-0 w-full p-5 bg-white box-border flex flex-col gap-3">
        <button class="w-full p-4 bg-primary text-white rounded-full text-lg shadow-[0_4px_6px_rgba(74,136,247,0.2)] hover:bg-primaryHover transition-colors" onclick="validateStep1()">Continue</button>
    </div>
</div>
    
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./stepper.js"></script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxKHkRpwH9qXAzyIaHq9hZKwYQS_YzB3pEkpAL-8A2x2Z-o8KU4ZvlIIL338KHRgt1Iog/exec"; 
    const LIFF_ID = "2011391523-fqHvpw34";

    let shopData = {};
    let bookingForm = { phone: '', date: '', service: '', time: '', lineUserId: '' };
    let myStepper;

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (liff.isInClient() || liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        bookingForm.lineUserId = profile.userId;
                    }).catch(err => console.error("Error getting profile:", err));
                }
            })
            .catch((err) => console.error("LIFF Init Error: ", err));

        myStepper = new Stepper({
            containerId: 'stepper-container',
            steps: ['Start', 'Step2', 'Finish'],
            initialStep: 1,
            onStepChange: function(newStep) {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('flex');
                    screen.classList.add('hidden');
                });
                document.getElementById('screen' + newStep).classList.remove('hidden');
                document.getElementById('screen' + newStep).classList.add('flex');

                const bottomActions = document.getElementById('bottom-actions');
                if (newStep === 1) {
                    bottomActions.innerHTML = `<button class="w-full p-4 bg-primary text-white rounded-full text-lg shadow-[0_4px_6px_rgba(74,136,247,0.2)] hover:bg-primaryHover transition-colors" onclick="validateStep1()">Continue</button>`;
                } else if (newStep === 2) {
                    bottomActions.innerHTML = `
                        <button id="btn-next-step2" class="w-full p-4 bg-primary text-white rounded-full text-lg shadow-[0_4px_6px_rgba(74,136,247,0.2)] hover:bg-primaryHover transition-colors" onclick="validateStep2()">Next</button>
                        <button class="w-full p-4 bg-gray-100 text-gray-400 rounded-full text-lg hover:bg-gray-200 transition-colors" onclick="myStepper.prev()">Cancel</button>
                    `;
                } else if (newStep === 3) {
                    bottomActions.innerHTML = `<button class="w-full p-4 bg-primary text-white rounded-full text-lg shadow-[0_4px_6px_rgba(74,136,247,0.2)] hover:bg-primaryHover transition-colors" onclick="closeAndSendMessage()">ยืนยันและปิดหน้าต่าง</button>`;
                }
            }
        });

        fetch(API_URL + "?action=getShopData")
            .then(response => response.json())
            .then(data => initApp(data))
            .catch(error => {
                alert("ไม่สามารถดึงข้อมูลร้านได้ กรุณาลองใหม่อีกครั้ง");
            });
    });

    function initApp(data) {
        shopData = data;
        document.getElementById('loading-overlay').classList.add('hidden');
        renderServices();
        renderCalendar();
        
        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];
        const firstAvailableDate = shopData.dates.find(d => !closedDates.includes(d.fullDate));
        
        if (firstAvailableDate) {
            selectDate(firstAvailableDate.fullDate);
        } else {
            document.getElementById('times-container').innerHTML = '<p class="w-full text-center text-red-500">ขออภัยค่ะ ร้านปิดให้บริการในสัปดาห์นี้ทั้งหมด</p>';
        }
    }

    function renderServices() {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        shopData.services.forEach((srv, index) => {
            const div = document.createElement('div');
            div.className = `chip ${index === 0 ? 'active' : ''}`;
            div.innerText = srv;
            div.onclick = () => selectService(div, srv);
            container.appendChild(div);
        });
        if(shopData.services.length > 0) bookingForm.service = shopData.services[0];
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        container.innerHTML = '';
        
        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];

        shopData.dates.forEach(d => {
            const isClosed = closedDates.includes(d.fullDate);
            const wrapper = document.createElement('div');
            
            if (isClosed) {
                wrapper.innerHTML = `
                    <div class="text-[11px] text-red-400 mb-1 font-medium">ปิด</div>
                    <div class="cal-date disabled">${d.dateNum}</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="text-xs text-gray-500 mb-1">${d.dayStr}</div>
                    <div class="cal-date" id="date-${d.fullDate}" onclick="selectDate('${d.fullDate}')">${d.dateNum}</div>
                `;
            }
            container.appendChild(wrapper);
        });
    }

    function renderTimes(selectedDateFull) {
        const container = document.getElementById('times-container');
        container.innerHTML = '';
        bookingForm.time = ''; 

        const dateBookings = shopData.bookingCounts[selectedDateFull] || {};
        const now = new Date();
        const selectedDate = new Date(selectedDateFull);
        const isToday = now.getFullYear() === selectedDate.getFullYear() &&
                        now.getMonth() === selectedDate.getMonth() &&
                        now.getDate() === selectedDate.getDate();

        // ⚠️ เปลี่ยนให้ดึงเวลาแบบรายวัน (ดึงจากวันที่ลูกค้าเลือก) 
        // ถ้าวันนั้นไม่มีให้ตั้งเป็น Array ว่าง
        const dailyTimesArray = shopData.dailyTimes && shopData.dailyTimes[selectedDateFull] 
                                ? shopData.dailyTimes[selectedDateFull] 
                                : [];

        if (dailyTimesArray.length === 0) {
            container.innerHTML = '<p class="w-full text-center text-gray-400 my-4">ไม่มีรอบเวลาให้บริการในวันนี้</p>';
            return;
        }

        dailyTimesArray.forEach(t => {
            const bookedCount = dateBookings[t.timeStr] || 0;
            
            const isClosedByAdmin = t.isActive === false || String(t.isActive).toUpperCase() === 'FALSE';
            let isDisabled = (bookedCount >= t.maxQueue) || isClosedByAdmin; 

            if (isToday && !isDisabled) {
                const timeMatch = t.timeStr.match(/(\d{1,2})[.:](\d{2})/);
                if (timeMatch) {
                    const slotHour = parseInt(timeMatch[1], 10);
                    const slotMinute = parseInt(timeMatch[2], 10);
                    
                    if (now.getHours() > slotHour || (now.getHours() === slotHour && now.getMinutes() >= slotMinute)) {
                        isDisabled = true; 
                    }
                }
            }

            const div = document.createElement('div');
            div.className = `time-slot ${isDisabled ? 'disabled' : ''}`;
            div.innerText = t.timeStr;
            
            if(!isDisabled) {
                div.onclick = () => selectTime(div, t.timeStr);
            }
            container.appendChild(div);
        });
    }

    function selectService(element, serviceName) {
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.service = serviceName;
    }

    function selectDate(fullDate) {
        document.querySelectorAll('.cal-date').forEach(el => el.classList.remove('active'));
        const targetElement = document.getElementById(`date-${fullDate}`);
        if(targetElement) {
            targetElement.classList.add('active');
        }
        bookingForm.date = fullDate;
        renderTimes(fullDate); 
    }

    function selectTime(element, timeStr) {
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.time = timeStr;
    }

    function validateStep1() {
        const phone = document.getElementById('phone-input').value.trim();
        if(!phone) {
            document.getElementById('phone-error').classList.remove('hidden');
            return;
        }
        document.getElementById('phone-error').classList.add('hidden');
        bookingForm.phone = phone;
        myStepper.next();
    }

    function validateStep2() {
        if(!bookingForm.time) {
            alert("กรุณาเลือกรอบเวลาก่อนดำเนินการต่อ");
            return;
        }
        
        const btnNext = document.getElementById('btn-next-step2');
        btnNext.innerText = "กำลังบันทึกข้อมูล...";
        btnNext.disabled = true;

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'saveBooking',
                data: bookingForm
            })
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") {
                document.getElementById('summary-text').innerText = 
                    `เบอร์: ${bookingForm.phone}\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date} เวลา ${bookingForm.time}`;
                myStepper.next(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + res.message);
                btnNext.innerText = "Next";
                btnNext.disabled = false;
            }
        })
        .catch(error => {
            alert("บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่");
            btnNext.innerText = "Next";
            btnNext.disabled = false;
        });
    }

    function closeAndSendMessage() {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.sendMessages([
                {
                    type: 'text',
                    text: `ยืนยันการจองคิวค่ะ 🎉\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date}\nเวลา: ${bookingForm.time} น.`
                }
            ]).then(() => {
                liff.closeWindow(); 
            }).catch((error) => {
                liff.closeWindow(); 
            });
        } else {
            alert("บันทึกคิวเรียบร้อยแล้ว!");
            location.reload(); 
        }
    }
</script>

</body>
</html>
