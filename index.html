<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: '#4a88f7', primaryHover: '#3b76d9',
                        stepBg: '#eef4ff', stepInactive: '#b0c4de', grayLight: '#f3f4f6',
                        bgLight: '#f4f5f7'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .step-item.active .step-circle, .step-item.completed .step-circle { @apply bg-primary; }
            .step-item.active .step-text, .step-item.completed .step-text { @apply text-primary; }
            
            .chip { @apply px-5 py-2.5 bg-grayLight rounded-full text-[13px] text-gray-600 cursor-pointer transition-colors duration-200 border border-transparent shadow-sm; }
            .chip.active { @apply bg-primary text-white shadow-md border-primary; }
            
            .time-slot { @apply px-4 py-2 bg-grayLight rounded-2xl text-[13px] text-gray-700 cursor-pointer transition-all shadow-sm; }
            .time-slot.active { @apply bg-primary text-white shadow-md; }
            .time-slot.disabled { @apply line-through text-gray-400 bg-gray-50 shadow-none cursor-not-allowed; pointer-events: none; }
            
            .cal-date { @apply w-11 h-11 rounded-full flex justify-center items-center text-sm cursor-pointer transition-all; }
            .cal-date.active { @apply bg-primary text-white shadow-md font-medium; }
            .cal-date.disabled { @apply bg-transparent text-red-300 cursor-not-allowed; pointer-events: none; }
            .cal-day-text { @apply text-xs text-gray-600 font-medium mb-2; }
            
            .content-card { @apply bg-white rounded-3xl p-5 shadow-sm mb-4 border border-gray-50; }
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center m-0 p-0 font-sans">

<!-- หน้าจอ Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลร้าน...</p>
</div>

<!-- คอนเทนเนอร์หลักของ Stepper ยังคงใช้ items-center ได้เลย เพื่อให้เส้นตรงกับกึ่งกลางวงกลม -->
<div class="flex items-center justify-between w-full px-4 py-6">

    <!-- Step 1: Start -->
    <div class="relative flex justify-center">
        <!-- ลูกกลมๆ -->
        <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <!-- ข้อความ (ใช้ absolute ลอยอยู่ด้านล่าง) -->
        <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2 text-center text-blue-500 font-medium text-sm w-max">
            Start
        </span>
    </div>

    <!-- เส้นเชื่อม -->
    <div class="flex-1 h-[2px] bg-blue-500 -mx-1"></div>

    <!-- Step 2: Current Step (มี 2 บรรทัด) -->
    <div class="relative flex justify-center">
        <!-- ลูกกลมๆ -->
        <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center z-10">
            2
        </div>
        <!-- ข้อความ (ใช้ absolute ลอยอยู่ด้านล่าง) -->
        <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2 text-center text-blue-500 font-medium text-sm w-max">
            Current<br>Step
        </span>
    </div>

    <!-- เส้นเชื่อม -->
    <div class="flex-1 h-[2px] bg-gray-300 -mx-1"></div>

    <!-- Step 3: Finish -->
    <div class="relative flex justify-center">
        <!-- ลูกกลมๆ -->
        <div class="w-10 h-10 rounded-full bg-gray-300 text-white flex items-center justify-center z-10">
            3
        </div>
        <!-- ข้อความ (ใช้ absolute ลอยอยู่ด้านล่าง) -->
        <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2 text-center text-gray-400 font-medium text-sm w-max">
            Finish
        </span>
    </div>

</div>
    
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./stepper.js"></script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwtCB6OjC7OWc9IyV5GRPdX6_TYIawm4OcCM8R2VDU84kcQlkNaf5tCIRSJ44rXct9tgQ/exec"; 
    const LIFF_ID = "2011391523-fqHvpw34";

    let shopData = {};
    let bookingForm = { phone: '', date: '', service: '', time: '', lineUserId: '' };
    let myStepper;

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (liff.isInClient() || liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        bookingForm.lineUserId = profile.userId;
                    }).catch(err => console.error("Error getting profile:", err));
                }
            })
            .catch((err) => console.error("LIFF Init Error: ", err));

        myStepper = new Stepper({
            containerId: 'stepper-container',
            steps: ['Start', 'Step2', 'Finish'],
            initialStep: 1,
            onStepChange: function(newStep) {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('flex');
                    screen.classList.add('hidden');
                });
                document.getElementById('screen' + newStep).classList.remove('hidden');
                document.getElementById('screen' + newStep).classList.add('flex');

                const bottomActions = document.getElementById('bottom-actions');
                
                if (newStep === 1) {
                    bottomActions.innerHTML = `
                        <button class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-md hover:bg-blue-600 transition-colors" onclick="validateStep1()">Next</button>
                        <div class="flex gap-3 w-full mt-1">
                            <a href="tel:0957356302" class="flex-1 py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center gap-2 hover:bg-blue-50 transition-colors">
                                <span>จองคิวเวลาอื่น</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            </a>
                            <button onclick="if(typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();" class="w-[90px] py-3.5 px-4 bg-white border border-primary text-primary rounded-full text-[16px] font-medium flex justify-center items-center hover:bg-blue-50 transition-colors">
                                แชท
                            </button>
                        </div>
                    `;
                } else if (newStep === 2) {
                    // ปรับแต่งปุ่มให้โค้งมนแบบเต็ม (rounded-full) ตามรูป ref และเปลี่ยนสี
                    bottomActions.innerHTML = `
                        <button id="btn-next-step2" class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-sm hover:bg-blue-600 transition-colors" onclick="validateStep2()">ยืนยันการจองคิว</button>
                        <button class="w-full py-3.5 px-4 bg-[#e5e7eb] text-gray-400 rounded-full text-[17px] font-medium hover:bg-gray-300 transition-colors mt-1" onclick="myStepper.prev()">กลับไปแก้ไขเวลา</button>
                    `;
                } else if (newStep === 3) {
                    bottomActions.innerHTML = `<button class="w-full py-3.5 px-4 bg-primary text-white rounded-full text-[17px] font-medium shadow-md hover:bg-blue-600 transition-colors" onclick="closeAndSendMessage()">ยืนยันและปิดหน้าต่าง</button>`;
                }
            }
        });

        fetch(API_URL + "?action=getShopData")
            .then(response => response.json())
            .then(data => initApp(data))
            .catch(error => {
                alert("ไม่สามารถดึงข้อมูลร้านได้ กรุณาลองใหม่อีกครั้ง");
            });
    });

    function initApp(data) {
        shopData = data;
        document.getElementById('loading-overlay').classList.add('hidden');
        renderServices();
        renderCalendar();
        
        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];
        const firstAvailableDate = shopData.dates.find(d => !closedDates.includes(d.fullDate));
        
        if (firstAvailableDate) {
            selectDate(firstAvailableDate.fullDate);
        } else {
            document.getElementById('times-container').innerHTML = '<p class="w-full text-center text-red-500">ขออภัยค่ะ ร้านปิดให้บริการในสัปดาห์นี้ทั้งหมด</p>';
        }
    }

    function renderServices() {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        shopData.services.forEach((srv, index) => {
            const div = document.createElement('div');
            div.className = `chip ${index === 0 ? 'active' : ''}`;
            div.innerText = srv;
            div.onclick = () => selectService(div, srv);
            container.appendChild(div);
        });
        if(shopData.services.length > 0) bookingForm.service = shopData.services[0];
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        container.innerHTML = '';
        
        // 🌟 ส่วนที่เพิ่มใหม่: คำนวณและแสดงผล เดือน/ปี จากข้อมูลวันแรก
        const header = document.getElementById('calendar-header');
        if (shopData.dates && shopData.dates.length > 0 && header) {
            const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            let firstDateStr = shopData.dates[0].fullDate;
            let monthIndex = 0;
            let year = 0;

            // ดึงตัวเลขเดือนและปี ออกมาจากวันที่ (รองรับทั้งแบบ 2026-08-29 และ 29/08/2026)
            if (firstDateStr.includes('-')) {
                const parts = firstDateStr.split('-');
                year = parseInt(parts[0], 10);
                monthIndex = parseInt(parts[1], 10) - 1;
            } else if (firstDateStr.includes('/')) {
                const parts = firstDateStr.split('/');
                year = parseInt(parts[2], 10);
                monthIndex = parseInt(parts[1], 10) - 1;
            }
            
            if (year < 2500) year += 543; // แปลง ค.ศ. เป็น พ.ศ. อัตโนมัติ
            header.innerHTML = `${thaiMonths[monthIndex]} ${year}`;
        }

        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];

        shopData.dates.forEach(d => {
            const isClosed = closedDates.includes(d.fullDate);
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center gap-1.5";
            
            if (isClosed) {
                wrapper.innerHTML = `
                    <div class="cal-day-text text-red-400">ปิด</div>
                    <div class="cal-date disabled">${d.dateNum}</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="cal-day-text">${d.dayStr}</div>
                    <div class="cal-date" id="date-${d.fullDate}" onclick="selectDate('${d.fullDate}')">${d.dateNum}</div>
                `;
            }
            container.appendChild(wrapper);
        });
    }

    function renderTimes(selectedDateFull) {
        const container = document.getElementById('times-container');
        container.innerHTML = '';
        bookingForm.time = ''; 

        const dateBookings = shopData.bookingCounts[selectedDateFull] || {};
        const now = new Date();
        const selectedDate = new Date(selectedDateFull);
        const isToday = now.getFullYear() === selectedDate.getFullYear() &&
                        now.getMonth() === selectedDate.getMonth() &&
                        now.getDate() === selectedDate.getDate();

        let baseTimes = shopData.defaultTimes ? JSON.parse(JSON.stringify(shopData.defaultTimes)) : [];
        let dailyTimes = (shopData.dailyTimes && shopData.dailyTimes[selectedDateFull]) ? shopData.dailyTimes[selectedDateFull] : [];

        let mergedMap = new Map();
        baseTimes.forEach(t => mergedMap.set(t.timeStr, t));
        dailyTimes.forEach(t => mergedMap.set(t.timeStr, t));

        let timesArrayToUse = Array.from(mergedMap.values()).sort((a, b) => {
            let timeA = parseFloat(a.timeStr.replace(/[^0-9.]/g, ''));
            let timeB = parseFloat(b.timeStr.replace(/[^0-9.]/g, ''));
            return timeA - timeB;
        });

        if (timesArrayToUse.length === 0) {
            container.innerHTML = '<p class="w-full text-center text-gray-400 mt-4">ไม่มีรอบเวลาให้บริการในวันนี้</p>';
            return;
        }

        timesArrayToUse.forEach(t => {
            const bookedCount = dateBookings[t.timeStr] || 0;
            const isClosedByAdmin = t.isActive === false || String(t.isActive).toUpperCase() === 'FALSE';
            let isDisabled = (bookedCount >= t.maxQueue) || isClosedByAdmin; 

            if (isToday && !isDisabled) {
                const timeMatch = t.timeStr.match(/(\d{1,2})[.:](\d{2})/);
                if (timeMatch) {
                    const slotHour = parseInt(timeMatch[1], 10);
                    const slotMinute = parseInt(timeMatch[2], 10);
                    if (now.getHours() > slotHour || (now.getHours() === slotHour && now.getMinutes() >= slotMinute)) {
                        isDisabled = true; 
                    }
                }
            }

            const div = document.createElement('div');
            div.className = `time-slot ${isDisabled ? 'disabled' : ''}`;
            div.innerText = t.timeStr;
            
            if(!isDisabled) {
                div.onclick = () => selectTime(div, t.timeStr);
            }
            container.appendChild(div);
        });
    }

    function selectService(element, serviceName) {
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.service = serviceName;
    }

    function selectDate(fullDate) {
        document.querySelectorAll('.cal-date').forEach(el => el.classList.remove('active'));
        const targetElement = document.getElementById(`date-${fullDate}`);
        if(targetElement) {
            targetElement.classList.add('active');
        }
        bookingForm.date = fullDate;
        renderTimes(fullDate); 
    }

    function selectTime(element, timeStr) {
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.time = timeStr;
    }

    function validateStep1() {
        if(!bookingForm.time) {
            alert("กรุณาเลือกรอบเวลาก่อนดำเนินการต่อ");
            return;
        }
        
        // ⚠️ ปรับแก้ให้ตรงตามดีไซน์: แสดงข้อความเป็นตัวหนา
        document.getElementById('booking-preview').innerHTML = 
            `<p>บริการ: <span class="font-bold text-black">${bookingForm.service}</span></p>
             <p>วันที่: <span class="font-bold text-black">${bookingForm.date}</span></p>
             <p>เวลา: <span class="font-bold text-black">${bookingForm.time} น.</span></p>`;
             
        myStepper.next();
    }

    function validateStep2() {
        const phone = document.getElementById('phone-input').value.trim();
        if(!phone) {
            document.getElementById('phone-error').classList.remove('hidden');
            return;
        }
        document.getElementById('phone-error').classList.add('hidden');
        bookingForm.phone = phone;
        
        const btnNext = document.getElementById('btn-next-step2');
        btnNext.innerText = "กำลังบันทึกข้อมูล...";
        btnNext.disabled = true;

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'saveBooking',
                data: bookingForm
            })
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") {
                document.getElementById('summary-text').innerText = 
                    `เบอร์: ${bookingForm.phone}
บริการ: ${bookingForm.service}
วันที่: ${bookingForm.date} เวลา ${bookingForm.time}`;
                myStepper.next(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + res.message);
                btnNext.innerText = "ยืนยันการจองคิว";
                btnNext.disabled = false;
            }
        })
        .catch(error => {
            alert("บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่");
            btnNext.innerText = "ยืนยันการจองคิว";
            btnNext.disabled = false;
        });
    }

    function closeAndSendMessage() {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.sendMessages([
                {
                    type: 'text',
                    text: `ยืนยันการจองคิวค่ะ 🎉
บริการ: ${bookingForm.service}
วันที่: ${bookingForm.date}
เวลา: ${bookingForm.time} น.`
                }
            ]).then(() => {
                liff.closeWindow(); 
            }).catch((error) => {
                liff.closeWindow(); 
            });
        } else {
            alert("บันทึกคิวเรียบร้อยแล้ว!");
            location.reload(); 
        }
    }
</script>

</body>
</html>
