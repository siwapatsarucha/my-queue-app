<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Kanit', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6', primaryHover: '#2563eb',
                        bgLight: '#f4f5f7', stepInactive: '#d1d5db',
                        chipBg: '#f3f4f6'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .step-item.active .step-circle, .step-item.completed .step-circle { @apply bg-primary text-white; }
            .step-item.active .step-text, .step-item.completed .step-text { @apply text-primary; }
            
            /* Chips สำหรับบริการ */
            .chip { @apply px-4 py-2 bg-chipBg rounded-full text-[13px] text-gray-500 cursor-pointer transition-colors duration-200 font-medium; }
            .chip.active { @apply bg-primary text-white; }
            
            /* Chips สำหรับเวลา */
            .time-slot { @apply px-4 py-2 bg-chipBg rounded-full text-[13px] text-gray-700 cursor-pointer transition-colors font-medium; }
            .time-slot.active { @apply bg-primary text-white; }
            .time-slot.disabled { @apply line-through text-gray-400 bg-gray-100 cursor-not-allowed pointer-events-none; }
            
            /* ปฏิทิน */
            .cal-date { @apply w-[42px] h-[42px] rounded-full flex justify-center items-center text-[15px] cursor-pointer transition-colors; }
            .cal-date.active { @apply bg-primary text-white shadow-md font-medium; }
            .cal-date.disabled { @apply bg-transparent text-gray-300 cursor-not-allowed pointer-events-none; }
        }
    </style>
</head>
<body class="bg-gray-200 flex justify-center m-0 p-0 font-sans text-gray-800">

<!-- หน้าจอ Loading -->
<div id="loading-overlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary mb-4"></div>
    <p class="text-gray-500 text-sm">กำลังโหลดข้อมูลร้าน...</p>
</div>

<div class="w-full max-w-[400px] h-screen bg-bgLight relative flex flex-col overflow-x-hidden border-x border-gray-100">
    
    <!-- พื้นที่แสดง Stepper -->
    <div class="bg-bgLight pt-8 pb-4" id="stepper-container"></div>

    <!-- Screen 1 -->
    <div class="screen flex flex-col p-6 flex-grow pb-[180px]" id="screen1">
        <div class="mt-auto mb-auto text-center">
            <p class="text-gray-500 mb-8 text-base">กรุณาใส่เบอร์โทร<br>เพื่อจองคิว</p>
            <input type="tel" id="phone-input" class="border-b border-gray-400 w-4/5 text-xl text-center p-2 bg-transparent outline-none focus:border-primary transition-colors" placeholder="08x-xxx-xxxx">
            <p id="phone-error" class="text-red-500 text-sm mt-3 hidden">กรุณาระบุเบอร์โทรศัพท์</p>
        </div>
    </div>

    <!-- Screen 2 (ดีไซน์ใหม่) -->
    <div class="screen hidden flex-col px-5 pt-2 flex-grow pb-[200px] overflow-y-auto gap-4" id="screen2">
        
        <!-- ปฏิทิน -->
        <div class="bg-white rounded-[24px] p-5 shadow-sm">
            <div id="calendar-container" class="flex justify-between items-center text-center"></div>
        </div>

        <!-- บริการ -->
        <div class="bg-white rounded-[24px] p-5 shadow-sm">
            <div id="services-container" class="flex flex-wrap gap-2.5"></div>
        </div>

        <!-- เวลา -->
        <div class="bg-white rounded-[24px] p-5 shadow-sm min-h-[160px]">
            <div id="times-container" class="flex flex-wrap content-start gap-2.5"></div>
        </div>

        <!-- ปุ่มโทรจองเวลาอื่น -->
        <a href="tel:0957356302" class="w-full mt-2 py-3.5 bg-transparent border-2 border-[#30b0ff] text-[#30b0ff] rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-50 transition-colors">
            <span class="text-[17px] font-normal">จองคิวเวลาอื่น</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        </a>
    </div>

    <!-- Screen 3 -->
    <div class="screen hidden flex-col p-6 flex-grow pb-[180px]" id="screen3">
        <div class="m-auto text-center">
            <h1 class="text-[42px] text-gray-800 font-normal leading-[1.3] m-0">จองคิว<br>เรียบร้อยค่ะ</h1>
            <p id="summary-text" class="text-gray-500 mt-4 text-sm"></p>
        </div>
    </div>

    <!-- Bottom Actions -->
    <div id="bottom-actions" class="absolute bottom-0 left-0 w-full p-5 bg-bgLight box-border flex flex-col gap-3 z-10 pb-8">
        <!-- ปุ่มจะถูกแทรกด้วย JavaScript -->
    </div>
</div>
    
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./stepper.js"></script>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxKHkRpwH9qXAzyIaHq9hZKwYQS_YzB3pEkpAL-8A2x2Z-o8KU4ZvlIIL338KHRgt1Iog/exec"; 
    const LIFF_ID = "2011391523-fqHvpw34";

    let shopData = {};
    let bookingForm = { phone: '', date: '', service: '', time: '', lineUserId: '' };
    let myStepper;

    document.addEventListener("DOMContentLoaded", () => {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (liff.isInClient() || liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        bookingForm.lineUserId = profile.userId;
                    }).catch(err => console.error("Error getting profile:", err));
                }
            })
            .catch((err) => console.error("LIFF Init Error: ", err));

        myStepper = new Stepper({
            containerId: 'stepper-container',
            steps: ['Start', 'Current Step', 'Finish'], // เปลี่ยนชื่อ Step ตามแบบ
            initialStep: 1,
            onStepChange: function(newStep) {
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('flex');
                    screen.classList.add('hidden');
                });
                document.getElementById('screen' + newStep).classList.remove('hidden');
                document.getElementById('screen' + newStep).classList.add('flex');

                const bottomActions = document.getElementById('bottom-actions');
                if (newStep === 1) {
                    bottomActions.innerHTML = `<button class="w-full py-4 bg-primary text-white rounded-full text-[17px] font-normal hover:bg-primaryHover transition-colors" onclick="validateStep1()">Continue</button>`;
                } else if (newStep === 2) {
                    bottomActions.innerHTML = `
                        <button id="btn-next-step2" class="w-full py-4 bg-primary text-white rounded-full text-[17px] font-normal hover:bg-primaryHover transition-colors" onclick="validateStep2()">Next</button>
                        <button class="w-full py-4 bg-[#e5e7eb] text-[#9ca3af] rounded-full text-[17px] font-normal hover:bg-gray-300 transition-colors" onclick="myStepper.prev()">Cancel</button>
                    `;
                } else if (newStep === 3) {
                    bottomActions.innerHTML = `<button class="w-full py-4 bg-primary text-white rounded-full text-[17px] font-normal hover:bg-primaryHover transition-colors" onclick="closeAndSendMessage()">ยืนยันและปิดหน้าต่าง</button>`;
                }
            }
        });

        fetch(API_URL + "?action=getShopData")
            .then(response => response.json())
            .then(data => initApp(data))
            .catch(error => {
                alert("ไม่สามารถดึงข้อมูลร้านได้ กรุณาลองใหม่อีกครั้ง");
            });
    });

    function initApp(data) {
        shopData = data;
        document.getElementById('loading-overlay').classList.add('hidden');
        renderServices();
        renderCalendar();
        
        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];
        const firstAvailableDate = shopData.dates.find(d => !closedDates.includes(d.fullDate));
        
        if (firstAvailableDate) {
            selectDate(firstAvailableDate.fullDate);
        } else {
            document.getElementById('times-container').innerHTML = '<p class="w-full text-center text-red-500">ขออภัยค่ะ ร้านปิดให้บริการในสัปดาห์นี้ทั้งหมด</p>';
        }
    }

    function renderServices() {
        const container = document.getElementById('services-container');
        container.innerHTML = '';
        shopData.services.forEach((srv, index) => {
            const div = document.createElement('div');
            div.className = `chip ${index === 0 ? 'active' : ''}`;
            div.innerText = srv;
            div.onclick = () => selectService(div, srv);
            container.appendChild(div);
        });
        if(shopData.services.length > 0) bookingForm.service = shopData.services[0];
    }

    function renderCalendar() {
        const container = document.getElementById('calendar-container');
        container.innerHTML = '';
        
        const closedDates = shopData.closedDays ? shopData.closedDays.map(cd => cd.dateStr) : [];

        shopData.dates.forEach(d => {
            const isClosed = closedDates.includes(d.fullDate);
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col items-center gap-1.5";
            
            if (isClosed) {
                wrapper.innerHTML = `
                    <div class="text-[13px] text-gray-500">${d.dayStr}</div>
                    <div class="cal-date disabled">${d.dateNum}</div>
                    <div class="text-[10px] text-red-400 mt-[-4px]">ปิด</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="text-[13px] text-gray-800">${d.dayStr}</div>
                    <div class="cal-date" id="date-${d.fullDate}" onclick="selectDate('${d.fullDate}')">${d.dateNum}</div>
                `;
            }
            container.appendChild(wrapper);
        });
    }

    function renderTimes(selectedDateFull) {
        const container = document.getElementById('times-container');
        container.innerHTML = '';
        bookingForm.time = ''; 

        const dateBookings = shopData.bookingCounts[selectedDateFull] || {};
        const now = new Date();
        const selectedDate = new Date(selectedDateFull);
        const isToday = now.getFullYear() === selectedDate.getFullYear() &&
                        now.getMonth() === selectedDate.getMonth() &&
                        now.getDate() === selectedDate.getDate();

        const dailyTimesArray = shopData.dailyTimes && shopData.dailyTimes[selectedDateFull] 
                                ? shopData.dailyTimes[selectedDateFull] 
                                : [];

        if (dailyTimesArray.length === 0) {
            container.innerHTML = '<p class="w-full text-center text-gray-400 my-4 text-[14px]">ไม่มีรอบเวลาให้บริการในวันนี้</p>';
            return;
        }

        dailyTimesArray.forEach(t => {
            const bookedCount = dateBookings[t.timeStr] || 0;
            const isClosedByAdmin = t.isActive === false || String(t.isActive).toUpperCase() === 'FALSE';
            let isDisabled = (bookedCount >= t.maxQueue) || isClosedByAdmin; 

            if (isToday && !isDisabled) {
                const timeMatch = t.timeStr.match(/(\d{1,2})[.:](\d{2})/);
                if (timeMatch) {
                    const slotHour = parseInt(timeMatch[1], 10);
                    const slotMinute = parseInt(timeMatch[2], 10);
                    if (now.getHours() > slotHour || (now.getHours() === slotHour && now.getMinutes() >= slotMinute)) {
                        isDisabled = true; 
                    }
                }
            }

            const div = document.createElement('div');
            div.className = `time-slot ${isDisabled ? 'disabled' : ''}`;
            div.innerText = t.timeStr;
            
            if(!isDisabled) {
                div.onclick = () => selectTime(div, t.timeStr);
            }
            container.appendChild(div);
        });
    }

    function selectService(element, serviceName) {
        document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.service = serviceName;
    }

    function selectDate(fullDate) {
        document.querySelectorAll('.cal-date').forEach(el => el.classList.remove('active'));
        const targetElement = document.getElementById(`date-${fullDate}`);
        if(targetElement) {
            targetElement.classList.add('active');
        }
        bookingForm.date = fullDate;
        renderTimes(fullDate); 
    }

    function selectTime(element, timeStr) {
        document.querySelectorAll('.time-slot').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        bookingForm.time = timeStr;
    }

    function validateStep1() {
        const phone = document.getElementById('phone-input').value.trim();
        if(!phone) {
            document.getElementById('phone-error').classList.remove('hidden');
            return;
        }
        document.getElementById('phone-error').classList.add('hidden');
        bookingForm.phone = phone;
        myStepper.next();
    }

    function validateStep2() {
        if(!bookingForm.time) {
            alert("กรุณาเลือกรอบเวลาก่อนดำเนินการต่อ");
            return;
        }
        
        const btnNext = document.getElementById('btn-next-step2');
        btnNext.innerText = "กำลังบันทึกข้อมูล...";
        btnNext.disabled = true;

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'saveBooking',
                data: bookingForm
            })
        })
        .then(response => response.json())
        .then(res => {
            if(res.status === "success") {
                document.getElementById('summary-text').innerText = 
                    `เบอร์: ${bookingForm.phone}\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date} เวลา ${bookingForm.time}`;
                myStepper.next(); 
            } else {
                alert("เกิดข้อผิดพลาด: " + res.message);
                btnNext.innerText = "Next";
                btnNext.disabled = false;
            }
        })
        .catch(error => {
            alert("บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่");
            btnNext.innerText = "Next";
            btnNext.disabled = false;
        });
    }

    function closeAndSendMessage() {
        if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.sendMessages([
                {
                    type: 'text',
                    text: `ยืนยันการจองคิวค่ะ 🎉\nบริการ: ${bookingForm.service}\nวันที่: ${bookingForm.date}\nเวลา: ${bookingForm.time} น.`
                }
            ]).then(() => {
                liff.closeWindow(); 
            }).catch((error) => {
                liff.closeWindow(); 
            });
        } else {
            alert("บันทึกคิวเรียบร้อยแล้ว!");
            location.reload(); 
        }
    }
</script>

</body>
</html>
